services:

  api:
    build: .
    container_name: autonomous-data-analyst-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/analytics/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  streamlit:
    build: .
    container_name: autonomous-data-analyst-streamlit
    command: streamlit run app/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped